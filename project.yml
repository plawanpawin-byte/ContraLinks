name: ContraLinks
options:
  bundleIdPrefix: com.plawanpawin
  deploymentTarget:
    iOS: "17.0"

targets:
  ContraLinks:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - App/Sources
      - App/Assets.xcassets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: ContraLinks
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_NAME: ContraLinks
        PRODUCT_BUNDLE_IDENTIFIER: com.plawanpawin.ContraLinks
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
